name: Sample Node App CI

on:
  push:
    paths:
      - "apps/sample-node-app/**"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "apps/sample-node-app/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sample-node-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/sample-node-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag sample-node-app:${{ github.run_number }} .
